name: Publicar PromptDocentes en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
